<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bonus Entries Quiz</title>
  <style>
:root{
  --bg:#0b1020;
  --card:#111a33;
  --text:#e9ecf7;
  --muted:#b9c1df;
  --line:rgba(255,255,255,.12);
  --btn:#e9ecf7;
  --btnText:#0b1020;
  --danger:#ff6b6b;
  --ok:#66f2a0;
  --focus:#8bb1ff;
  --radius:16px;
  --green:#1a7d4e;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(1200px 600px at 20% -10%, rgba(139,177,255,.22), transparent 60%),
             radial-gradient(900px 500px at 120% 10%, rgba(102,242,160,.16), transparent 55%),
             var(--bg);
  color:var(--text);
  font:16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}

.quiz-shell{
  max-width:920px;
  margin:0 auto;
  padding:22px 14px 34px;
}

.topbar{
  display:flex;
  gap:14px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.brand{
  font-weight:700;
  letter-spacing:.2px;
  opacity:.95;
}

.report-link{
  font-size:13px;
  color:var(--muted);
  text-decoration:none;
  opacity:.7;
  transition:opacity .2s;
}

.report-link:hover{
  opacity:1;
  text-decoration:underline;
}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);
}

h1,h2,h3{margin:0 0 10px}
h1{font-size:28px; line-height:1.15}
h2{font-size:22px; line-height:1.2}
h3{font-size:18px; line-height:1.25}
p{margin:0 0 12px; color:var(--muted)}
ul{margin:10px 0 14px 18px; color:var(--muted); padding-left:8px}
ol{margin:10px 0 14px 18px; color:var(--muted); padding-left:8px}
li{margin:6px 0}

.hr{
  height:1px;
  background:var(--line);
  margin:24px 0;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.actions-between{
  justify-content:space-between;
  align-items:center;
}

button{
  appearance:none;
  border:1px solid transparent;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700;
  cursor:pointer;
}

.btn-primary{
  background:var(--btn);
  color:var(--btnText);
}
.btn-primary:disabled{opacity:.55; cursor:not-allowed}

.btn-ghost{
  background:transparent;
  border-color:var(--line);
  color:var(--text);
}

.btn-danger{
  background:transparent;
  border-color:rgba(255,107,107,.4);
  color:var(--text);
}

.btn-green{
  background:var(--green);
  color:#fff;
  border:1px solid transparent;
  border-radius:12px;
  padding:12px 14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  text-align:center;
}
.btn-green:disabled{opacity:.55; cursor:not-allowed}

.btn-primary:focus,
.btn-ghost:focus,
.btn-danger:focus,
.btn-green:focus,
.optionBtn:focus,
.input:focus{
  outline:2px solid var(--focus);
  outline-offset:2px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}

.optionBtn{
  width:auto;
  align-self:flex-start;
  min-width:200px;
  text-align:left;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:var(--text);
  padding:12px 20px;
  border-radius:12px;
}

.optionBtn[aria-pressed="true"]{
  border-color:rgba(139,177,255,.65);
  background:rgba(139,177,255,.12);
}

.kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  color:var(--text);
  opacity:.95;
  margin-bottom:10px;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(102,242,160,.12);
  border:1px solid rgba(102,242,160,.25);
  color:var(--text);
  font-size:12px;
  font-weight:800;
}

.progress{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:240px;
  justify-content:flex-end;
}

.progress__track{
  width:180px;
  height:14px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(139,177,255,.4);
  overflow:hidden;
}

.progress__fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, rgba(102,242,160,.9), rgba(139,177,255,.95));
  border-radius:999px;
  transition:width .35s ease;
}

.progress__label{
  font-size:14px;
  font-weight:700;
  color:var(--text);
  min-width:52px;
  text-align:right;
}

.inputRow{
  margin-top:16px;
}

.input{
  width:100%;
  max-width:400px;
  padding:14px 16px;
  border-radius:10px;
  border:2px solid rgba(139,177,255,.5);
  background:#fff;
  color:#1a1a2e;
  font-size:16px;
}

.input::placeholder{
  color:#888;
}

.input:focus{
  outline:none;
  border-color:rgba(139,177,255,.9);
  box-shadow:0 0 0 3px rgba(139,177,255,.2);
}

.input--error{
  border-color:rgba(255,107,107,.8);
}

.helper{
  font-size:13px;
  color:var(--muted);
  margin-top:8px;
}

.helper--error{
  color:rgba(255,107,107,.95);
}

.secret{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-top:10px;
  padding:14px;
  border-radius:14px;
  background:rgba(102,242,160,.10);
  border:1px solid rgba(102,242,160,.25);
}

.secret-inline{
  display:inline-flex;
  width:auto;
}

.secret code{
  font-size:18px;
  font-weight:900;
  letter-spacing:.6px;
  color:var(--text);
  background:transparent;
}

.note-good{color:rgba(102,242,160,.9)}
.note-bad{color:rgba(255,107,107,.95)}
.small{font-size:13px}
.link{color:var(--text); text-decoration:underline}
.footnote{
  margin-top:14px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.quiz-supertext{
  font-size:14px;
  color:var(--muted);
  margin:0 0 4px;
}

.quiz-headline{
  font-size:28px;
  font-weight:900;
  margin:0 0 4px;
  line-height:1.1;
}

.quiz-subtext{
  font-size:14px;
  color:var(--muted);
  margin:0 0 12px;
}

.spacer{
  height:16px;
}

.quiz-hero-img{
  display:block;
  width:600px;
  max-width:100%;
  height:auto;
  margin:12px 0;
  border-radius:12px;
}

.landing-content{
  display:flex;
  flex-direction:column;
}

@media (max-width:560px){
  .topbar{flex-direction:column; align-items:flex-start}
  .progress{width:100%; justify-content:space-between}
  .progress__track{flex:1}
  ul{margin-left:8px; padding-left:12px}
  ol{margin-left:8px; padding-left:12px}
}
  </style>
</head>
<body>
  <main class="quiz-shell" id="app">
    <header class="topbar">

========== */

  q1: {

    "Bigger Better Banner": [
      {
        bodyHtml: `Bigger Better Banner has a 5-star Google review that was left by Krisha Espiritu.\n\n<div class="spacer"></div>\nWhat does this review say?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "Bigger Better Banner Stanford Ave".</li>\n<li>Click the option to view their Google Reviews.</li>\n<li>Find the review left by Krisha Espiritu in December 2025.</li>\n</ol>\n<div class="hr"></div>\nWhat does Krisha Espiritu's review say?`,

      {
        bodyHtml: `CROTRAN offers Custom Dry Rub on Transfer Sheets.\n\n<div class="spacer"></div>\nWhat is the ship time for these sheets?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "CROTRAN".</li>\n<li>Open the CROTRAN (Custom Rub On Transfers) website.</li>\n<li>Scroll to the very bottom of the page and open the "FAQs" link.</li>\n<li>Click on the last question: "How fast can I have my Custom Dry Rub on Transfer sheet".</li>\n<li>You'll find the ship time (the answer) in the very first sentence.</li>\n</ol>\n<div class="hr"></div>\nCustom Dry Rub on Transfer sheet can ship _________.`,

    "ESA Awnings Inc.": [
      {
        bodyHtml: `ESA Awnings has a 5-star Google review that was left by Jamie Saure. The review includes a photo of a restaurant awning.\n\n<div class="spacer"></div>\nWhat does it say on this awning?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "ESA Awnings Inc.".</li>\n<li>Click the option to view their Google Reviews.</li>\n<li>Find the review left by Jamie Saure in November 2025.</li>\n<li>Find the image of the restaurant awning attached to the review, and read the text on the awning.</li>\n</ol>\n<div class="hr"></div>\nWhat does it say on the awning in the review photo (black awning with white text)?`,

    "Got Your Six Dispensary": [

        bodyHtml: `Got Your Six Dispensary has a 5-star Google review that was left by Moise Baptiste.\n\n<div class="spacer"></div>\nWhat does this review say?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "Got Your Six Dispensary".</li>\n<li>Click the option to view their Google Reviews.</li>\n<li>Find the review by sorting the reviews by "Newest", then scrolling down to the review left by Moise Baptiste in September 2025.</li>\n<li>You'll find the answer in this review.</li>\n</ol>\n<div class="hr"></div>\nWhat does Moise Baptiste's review say?`,

    "Platon Graphics": [
      {
        bodyHtml: `Platon Graphics has a 5-star Google review that was left by Lisa Lerman. The review mentions a specific product.\n\n<div class="spacer"></div>\nWhat is this product?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "Platon Graphics".</li>\n<li>Click the option to view their Google Reviews.</li>\n<li>Find the review by sorting the reviews by "Newest", then scrolling down to the review left by Lisa Lerman in September 2025.</li>\n<li>You'll find the answer in the first sentence of this review.</li>\n</ol>\n<div class="hr"></div>\nWhich product is mentioned in the first sentence of Lisa Lerman's review? "Platon Graphics is our go-to place for _________."\n`,

    "Printastic": [
      {
        bodyHtml: `What is Printastic's email address?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "Printastic".</li>\n<li>Open their official website.</li>\n<li>You'll find the email address at the very bottom of their website, in the left column of their footer.</li>\n</ol>\n<div class="hr"></div>\nWhat is the email address for Printastic?`,
        choices: [

        bodyHtml: `Which company created the chat feature on Printastic's website?\n\n<div class="spacer"></div>\n<strong>How to Find the Answer:</strong>\n<ol>\n<li>Search Google for "Printastic".</li>\n<li>Open their official website.</li>\n<li>Click the blue "Chat" button in the bottom right corner.</li>\n<li>The company name is shown in the bottom left corner of the chat window.</li>\n</ol>\n<div class="hr"></div>\nWhich of these companies handles Printastic's chat feature?`,
        choices: [

    "SOS Survival Products": [
      {

        choices: [
          {text: "Emergency Preparedness Class",      correct: true},
          {text: "Preparedness for Power Outages Class",correct: false},
          {text: "Disaster Preparedness Webinar",    correct: false},

// ---------- utilities ----------

const $ = (sel) => document.querySelector(sel);

function safeText(s) {
  return String(s ?? "");
}

function digitsOnly(s) {
  return safeText(s).replace(/\D+/g, "");
}

function normalizeClient(name) {
  return safeText(name).trim();
}

function resolveClient(name, dataSection) {
  const n = normalizeClient(name);
  if (QUIZ_DATA[dataSection][n]) return n;

  const alias = QUIZ_DATA.aliases[n];
  if (alias && QUIZ_DATA[dataSection][alias]) return alias;

  const keys = Object.keys(QUIZ_DATA[dataSection]);
  const lower = n.toLowerCase();
  const exactLower = keys.find(k => k.toLowerCase() === lower);
  if (exactLower) return exactLower;

  const contains = keys.find(k => k.toLowerCase().includes(lower) || lower.includes(k.toLowerCase()));
  if (contains) return contains;

  console.warn(`resolveClient: no match for "${name}" in "${dataSection}". Falling back to "${keys[0]}".`);
  return keys[0];
}

function getSearchTermForClient(clientDisplayName) {
  const key = clientDisplayName in QUIZ_DATA.searchTerms
    ? clientDisplayName
    : (QUIZ_DATA.aliases[clientDisplayName] || clientDisplayName);
  const terms = QUIZ_DATA.searchTerms[key] || [clientDisplayName];
  return terms[Math.floor(Math.random() * terms.length)];
}

function injectSearchTerm(bodyHtml, searchTerm) {
  return bodyHtml.replace(/(Search\s+Google\s+for\s+")([^"]+)(")/gi, (m, a, _old, c) => `${a}${searchTerm}${c}`);
}

const MONTHS = {
  january:1, february:2, march:3, april:4, may:5, june:6,
  july:7, august:8, september:9, october:10, november:11, december:12
};

function injectRelativeDates(bodyHtml) {
  const now = new Date();
  const nowYear  = now.getFullYear();
  const nowMonth = now.getMonth() + 1;
  return bodyHtml.replace(
    /\bin\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{4})\b/gi,
    (match, monthName, yearStr) => {
      const m = MONTHS[monthName.toLowerCase()];
      const y = parseInt(yearStr, 10);
      const diff = (nowYear - y) * 12 + (nowMonth - m);
      if (diff <= 0) return match;
      const label = diff === 1 ? "about 1 month ago" : `about ${diff} months ago`;
      return `${match} (${label})`;
    }
  );
}

function pickVariant(variantsArray) {
  return variantsArray[Math.floor(Math.random() * variantsArray.length)];
}

function shuffleArray(arr) {
  const result = [...arr];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function prepareChoices(choices) {
  const keys = ["A", "B", "C", "D"];
  return shuffleArray(choices).map((choice, idx) => ({
    key: keys[idx],
    text: choice.text,
    correct: choice.correct
  }));
}

function setProgress(step) {
  const clamped = Math.max(0, Math.min(3, step));
  const pct = (clamped / 3) * 100;
  $("#progressFill").style.width = `${pct}%`;
  $("#progressLabel").textContent = `${clamped} of 3`;
  document.querySelector(".progress__track").setAttribute("aria-valuenow", String(clamped));
}

function render(html) {
  $("#card").innerHTML = html;
}

// ---------- weighted random for Q1 ----------

function selectQ1Client() {
  const rand = Math.random() * 100;
  let cumulative = 0;
  for (const [client, weight] of Object.entries(Q1_WEIGHTS)) {
    cumulative += weight;
    if (rand < cumulative) return client;
  }
  return Object.keys(Q1_WEIGHTS)[0];
}

function selectQ2Client() {
  return Q2_CLIENTS[Math.floor(Math.random() * Q2_CLIENTS.length)];
}

// ---------- quiz state ----------

let state = {
  step: 0,
  q1Client:   null,
  q23Client:  null,
  q1Variant:  null,
  q2Variant:  null,
  q1Selected: null,
  q2Selected: null,
  q3Input:    "",
  q1Choices:  null,
  q2Choices:  null
};

function newQuizContext() {
  state.q1Client  = resolveClient(selectQ1Client(), "q1");
  state.q23Client = resolveClient(selectQ2Client(), "q2");

  state.q1Variant = pickVariant(QUIZ_DATA.q1[state.q1Client]);
  state.q2Variant = pickVariant(QUIZ_DATA.q2[state.q23Client]);

  state.q1Selected = null;
  state.q2Selected = null;
  state.q3Input    = "";

  state.q1Choices = prepareChoices(state.q1Variant.choices);
  state.q2Choices = prepareChoices(state.q2Variant.choices);
}

// ---------- views ----------

function landingView() {
  setProgress(0);
  render(`
    <div class="landing-content">
      <p class="quiz-supertext">Take this short quiz for</p>
      <h1 class="quiz-headline">1000 BONUS ENTRIES</h1>
      <p class="quiz-subtext">in our Amazon Gift Card Sweepstakes</p>
      <img src="quiz-banner.jpg" alt="" class="quiz-hero-img" />
      <div class="actions">
        <button class="btn-green" id="startBtn">Start Quiz</button>
      </div>
    </div>
  `);

  $("#startBtn").addEventListener("click", () => {
    newQuizContext();
    state.step = 1;
    question1View();
  });
}

function question1View() {
  const searchTerm = getSearchTermForClient(state.q1Client);
  const body = injectRelativeDates(injectSearchTerm(state.q1Variant.bodyHtml, searchTerm));

  setProgress(1);

  const optionsHtml = `<div class="options" role="group" aria-label="Answer choices">
    ${state.q1Choices.map(c => `
      <button type="button" class="optionBtn" data-key="${c.key}" aria-pressed="${state.q1Selected === c.key}">
        <strong>${c.key}.</strong> ${safeText(c.text)}
      </button>
    `).join("")}
  </div>`;

  render(`
    <div class="kicker"><span class="badge">Question 1</span> <span class="small">of 3</span></div>
    <div class="hr"></div>
    <div class="content">${body}</div>
    ${optionsHtml}
    <div class="actions actions-between">
      <button class="btn-green" id="submitBtn" ${!state.q1Selected ? "disabled" : ""}>Submit</button>
      <span></span>
    </div>
  `);

  document.querySelectorAll(".optionBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.q1Selected = btn.getAttribute("data-key");
      question1View();
    });
  });

  $("#submitBtn").addEventListener("click", () => {
    if (!state.q1Selected) return;
    state.step = 2;
    question2View();
  });
}

function question2View() {
  const searchTerm = getSearchTermForClient(state.q23Client);
  const body = injectRelativeDates(injectSearchTerm(state.q2Variant.bodyHtml, searchTerm));

  setProgress(2);

  const optionsHtml = `<div class="options" role="group" aria-label="Answer choices">
    ${state.q2Choices.map(c => `
      <button type="button" class="optionBtn" data-key="${c.key}" aria-pressed="${state.q2Selected === c.key}">
        <strong>${c.key}.</strong> ${safeText(c.text)}
      </button>
    `).join("")}
  </div>`;

  render(`
    <div class="kicker"><span class="badge">Question 2</span> <span class="small">of 3</span></div>
    <div class="hr"></div>
    <div class="content">${body}</div>
    ${optionsHtml}
    <div class="actions actions-between">
      <button class="btn-green" id="submitBtn" ${!state.q2Selected ? "disabled" : ""}>Submit</button>
      <button class="btn-ghost" id="goBackBtn" type="button">Go Back</button>
    </div>
  `);

  document.querySelectorAll(".optionBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.q2Selected = btn.getAttribute("data-key");
      question2View();
    });
  });

  $("#goBackBtn").addEventListener("click", () => {
    state.step = 1;
    question1View();
  });

  $("#submitBtn").addEventListener("click", () => {
    if (!state.q2Selected) return;
    state.step = 3;
    question3View();
  });
}

function question3View(validationError) {
  const q3Client = resolveClient(state.q23Client, "q3");
  const q = QUIZ_DATA.q3[q3Client];
  const searchTerm = getSearchTermForClient(state.q23Client);
  const body = injectRelativeDates(injectSearchTerm(q.bodyHtml, searchTerm));

  setProgress(3);

  const safeVal = safeText(state.q3Input).replace(/"/g, "&quot;");
  const inputHtml = `
    <div class="inputRow">
      <input class="input${validationError ? " input--error" : ""}" id="phoneInput"
        autocomplete="tel" inputmode="tel"
        placeholder="Paste or type the phone number"
        value="${safeVal}" />
      ${validationError ? `<p class="helper helper--error" id="phoneError">${validationError}</p>` : ""}
    </div>
  `;

  render(`
    <div class="kicker"><span class="badge">Question 3</span> <span class="small">of 3</span></div>
    <div class="hr"></div>
    <div class="content">${body}</div>
    ${inputHtml}
    <div class="actions actions-between">
      <button class="btn-green" id="submitBtn">Submit</button>
      <button class="btn-ghost" id="goBackBtn" type="button">Go Back</button>
    </div>
  `);

  const phoneInput = $("#phoneInput");
  phoneInput.addEventListener("input", (e) => {
    state.q3Input = e.target.value;
  });

  // Focus the input, placing cursor at end
  phoneInput.focus();
  phoneInput.setSelectionRange(phoneInput.value.length, phoneInput.value.length);

  $("#goBackBtn").addEventListener("click", () => {
    state.step = 2;
    question2View();
  });

  $("#submitBtn").addEventListener("click", () => {
    state.q3Input = $("#phoneInput").value;
    const digits = digitsOnly(state.q3Input);
    if (!digits) {
      question3View("Please enter a phone number before submitting.");
      return;
    }
    gradeQuiz();
  });
}

function gradeQuiz() {
  const q3Client = resolveClient(state.q23Client, "q3");
  const q3 = QUIZ_DATA.q3[q3Client];

  const q1SelectedChoice = state.q1Choices.find(c => c.key === state.q1Selected);
  const q2SelectedChoice = state.q2Choices.find(c => c.key === state.q2Selected);

  const correct1 = !!(q1SelectedChoice && q1SelectedChoice.correct);
  const correct2 = !!(q2SelectedChoice && q2SelectedChoice.correct);

  const userDigits    = digitsOnly(state.q3Input);
  const correctDigits = digitsOnly(q3.correctPhone);
  const correct3      = userDigits === correctDigits || userDigits === "1" + correctDigits;

  const score = [correct1, correct2, correct3].filter(Boolean).length;

  if (score === 3) {
    successView();
  } else {
    failView(score);
  }
}

function successView() {
  setProgress(3);
  const code = QUIZ_DATA.secretCode;

  render(`
    <div class="kicker"><span class="badge">Perfect score</span> <span class="small note-good">3 of 3 correct</span></div>
    <h2>Congrats - You've Unlocked a Secret Code!</h2>

    <div class="secret secret-inline">
      <code id="secretCode">${code}</code>
      <button class="btn-primary" id="copyBtn" type="button">Copy code</button>
    </div>

    <div class="actions">
      <a class="btn-green" href="https://gleam.io/91pEw/5-winners-real-prizes-enter-for-your-shot-at-a-500-amazon-gift-card" target="_blank" rel="noopener">Redeem Your Code Now</a>
    </div>
  `);

  $("#copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(code);
      $("#copyBtn").textContent = "Copied";
      setTimeout(() => { $("#copyBtn").textContent = "Copy code"; }, 1200);
    } catch {
      alert("Copy failed. Please highlight the code and copy it manually.");
    }
  });
}

function failView(score) {
  setProgress(3);
  render(`
    <div class="kicker"><span class="small note-bad">${score} of 3 correct</span></div>
    <h2>So Close!</h2>
    <p>You need 3 out of 3 to unlock the code. Give it another shot!</p>

    <img src="quiz-retake.jpg" alt="" class="quiz-hero-img" />

    <div class="actions">
      <button class="btn-green" id="tryAgainBtn" type="button">Try Again</button>
    </div>
  `);

  $("#tryAgainBtn").addEventListener("click", () => {
    newQuizContext();
    state.step = 1;
    question1View();
  });
}

document.addEventListener("DOMContentLoaded", () => {
  landingView();
});
  </script>
</body>
</html>
